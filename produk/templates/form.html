{% extends "base.html" %}

{% block title %}Form Produk{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-800">Form Produk</h2>
      <p class="text-sm text-gray-500">Tambah / Edit Data Produk</p>
    </div>

    <form method="post" class="space-y-5">
      {% csrf_token %}

      {% for field in form %}
        <div>
          <label class="block mb-1 text-sm font-semibold text-gray-600">
            {{ field.label }}
          </label>
          {{ field }}
          {% if field.errors %}
            <p class="text-red-500 text-sm mt-1">
              {{ field.errors|striptags }}
            </p>
          {% endif %}
        </div>
      {% endfor %}

      <div class="flex justify-between pt-6">
        <a href="/produk/" class="text-sm text-gray-500 hover:text-gray-700">← Kembali</a>
        <button class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
          Simpan
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
