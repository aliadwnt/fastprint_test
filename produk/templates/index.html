<h2>Produk Bisa Dijual</h2>

<a href="/produk/sync-api/">Sync API</a> |
<a href="/produk/tambah/">Tambah</a>

<table border="1">
<tr>
  <th>Nama</th><th>Harga</th><th>Aksi</th>
</tr>
{% for p in produk %}
<tr>
  <td>{{ p.nama_produk }}</td>
  <td>{{ p.harga }}</td>
  <td>
    <a href="/produk/edit/{{ p.id }}/">Edit</a>
    <a href="/produk/hapus/{{ p.id }}/"
       onclick="return confirm('Yakin hapus?')">Hapus</a>
  </td>
</tr>
{% endfor %}
</table>
